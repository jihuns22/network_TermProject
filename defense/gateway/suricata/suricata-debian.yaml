%YAML 1.1
---
vars:
  address-groups:
    HOME_NET: "[192.168.100.0/24,192.168.200.0/24]"
    EXTERNAL_NET: "!$HOME_NET"
  port-groups:
    HTTP_PORTS: "80"
    SHELLCODE_PORTS: "!80"
    ORACLE_PORTS: 1521
    SSH_PORTS: 22

default-log-dir: /var/log/suricata/

outputs:
  - fast:
      enabled: yes
      filename: fast.log
  - eve-log:
      enabled: yes
      filename: eve.json
      types:
        - alert
        - dns

af-packet:
  - interface: ens33

default-rule-path: /etc/suricata/rules

rule-files:
  - dns-tunnel.rules

detection-engine:
  profile: medium
